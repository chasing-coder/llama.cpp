name: Build llama.cpp CUDA 12.4 (RTX 3060)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/cuda-3060.yml

permissions:
  contents: read

concurrency:
  group: cuda-3060-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-sm86:
    name: Linux x86_64 / CUDA 12.4 / sm_86
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build build-essential \
            libssl-dev python3 file patchelf

      - name: Build llama-cli and llama-server
        run: |
          set -eu
          nvcc --version

          # No NVIDIA kernel driver is installed on GitHub-hosted runners.
          # Use CUDA's link-only driver stub to resolve libcuda.so.1 when
          # linking executables against libggml-cuda.so.
          # The stub MUST NOT be packaged or used on the user's machine.
          stub_dir=/usr/local/cuda/targets/x86_64-linux/lib/stubs
          test -f "$stub_dir/libcuda.so"
          if [ ! -e "$stub_dir/libcuda.so.1" ]; then
            ln -s libcuda.so "$stub_dir/libcuda.so.1"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=86-real \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-rpath-link,$stub_dir" \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_UI=OFF
          cmake --build build --target llama-cli llama-server -j 2

      - name: Package Linux binaries and CUDA 12.4 runtime
        run: |
          set -eu
          mkdir -p dist
          cp -a build/bin/. dist/
          test -x dist/llama-cli
          test -x dist/llama-server

          cuda_lib=/usr/local/cuda/targets/x86_64-linux/lib
          for pattern in \
            'libcudart.so.12*' \
            'libcublas.so.12*' \
            'libcublasLt.so.12*' \
            'libnvJitLink.so.12*' \
            'libnvrtc.so.12*' \
            'libnvrtc-builtins.so.12*'; do
            find "$cuda_lib" -maxdepth 1 -name "$pattern" \
              -exec cp -a {} dist/ \;
          done

          printf '%s\n' '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'export LD_LIBRARY_PATH="$here${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$here/llama-cli" "$@"' > dist/run-cli.sh

          printf '%s\n' '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
            'export LD_LIBRARY_PATH="$here${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$here/llama-server" "$@"' > dist/run-server.sh
          chmod +x dist/run-cli.sh dist/run-server.sh

          git rev-parse HEAD > dist/source-commit.txt
          cat > dist/README.txt <<'EOF'
          Linux x86_64, built with CUDA Toolkit 12.4.1 for NVIDIA sm_86 (RTX 3060).
          The NVIDIA driver must be installed on the target machine.
          Do not bundle or replace the system's libcuda.so driver library.

          Verify GPU:
            ./run-cli.sh --list-devices

          Run a local GGUF:
            ./run-cli.sh -m /path/to/model.gguf -c 2048 -ngl 99

          MoE offload example (requires recent llama.cpp model support):
            ./run-cli.sh -m /path/to/model.gguf -c 2048 -ngl 99 --n-cpu-moe 20

          A compatible Linux glibc/libstdc++ installation is also required.
          See source-commit.txt for the exact llama.cpp revision.
          EOF

          tar -czf llama-cuda124-sm86.tar.gz -C dist .
          sha256sum llama-cuda124-sm86.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda124-sm86
          path: llama-cuda124-sm86.tar.gz
          if-no-files-found: error
          retention-days: 7
