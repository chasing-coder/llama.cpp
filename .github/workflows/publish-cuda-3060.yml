name: Publish RTX 3060 CUDA build to Release

on:
  workflow_run:
    workflows:
      - Build llama.cpp CUDA 12.4 (RTX 3060)
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-cuda-3060
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_ARTIFACT: llama-cuda124-sm86

    steps:
      - name: Download successful build artifact
        run: |
          set -eu
          mkdir -p release
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir release
          test -s release/llama-cuda124-sm86.tar.gz
          tar -tzf release/llama-cuda124-sm86.tar.gz >/dev/null

          (
            cd release
            sha256sum llama-cuda124-sm86.tar.gz > llama-cuda124-sm86.tar.gz.sha256
            sha256sum -c llama-cuda124-sm86.tar.gz.sha256
          )

      - name: Create pre-release and upload assets
        run: |
          set -eu
          short_sha="$(printf '%s' "$SOURCE_SHA" | cut -c1-7)"
          release_tag="cuda124-sm86-$short_sha"

          cat > release-notes.md <<EOF
          RTX 3060 (sm_86) Linux x86_64 build of llama.cpp with CUDA Toolkit 12.4.1.

          Source commit: $SOURCE_SHA
          Successful Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN

          - CUDA 12.4.1, Ubuntu 22.04, CCCL v3.4.3.
          - Single-GPU build, NCCL disabled to remove the libnccl.so.2 dependency.
          - Contains llama-cli, llama-server and required bundled CUDA runtime libraries.
          - The NVIDIA driver is required on the target PC; CUDA driver stubs are not shipped.
          - CI compilation and packaging were successful. Runtime inference on RTX 3060 is unverified.

          Extract the tar.gz and run ./run-cli.sh --list-devices.
          EOF

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "RTX 3060 CUDA 12.4 / llama.cpp $short_sha" \
              --notes-file release-notes.md \
              --prerelease
          fi

          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              release/llama-cuda124-sm86.tar.gz \
              release/llama-cuda124-sm86.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Release asset upload failed after three attempts" >&2
              exit 1
            fi
            sleep 10
          done

          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --json url,assets
